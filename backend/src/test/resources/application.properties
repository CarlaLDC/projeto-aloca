# O banco dos testes é um MySQL em contêiner (Testcontainers, ver BancoMySqlTeste).
# URL, usuário e senha vêm do contêiner via @ServiceConnection.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
# READ COMMITTED: depois de travar os recursos, a checagem de conflito enxerga
# reservas que outra transação acabou de gravar (RF-06). No MySQL o padrão é REPEATABLE READ.
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.h2.console.enabled=false
aloca.jwt.segredo=segredo-de-teste-com-mais-de-32-caracteres
aloca.fuso-horario=America/Sao_Paulo
aloca.dados-demo=true
aloca.ciclo.intervalo=PT1H
spring.mvc.problemdetails.enabled=false
