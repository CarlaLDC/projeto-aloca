# Testes de integração: o banco é um PostgreSQL em container (veja PostgresTestcontainer).
# A URL, o usuário e a senha são preenchidos pelo Testcontainers (@ServiceConnection).
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
# READ COMMITTED (padrão do PostgreSQL): após travar os recursos, a checagem de conflito
# enxerga reservas gravadas por outra transação (RF-06).
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
aloca.jwt.segredo=segredo-de-teste-com-mais-de-32-caracteres
aloca.fuso-horario=America/Sao_Paulo
aloca.dados-demo=true
# Senha dos usuários de demonstração (só quando aloca.dados-demo=true)
aloca.dados-demo.senha=${ALOCA_SENHA_DEMO:aloca123}
aloca.ciclo.intervalo=PT1H
spring.mvc.problemdetails.enabled=false
