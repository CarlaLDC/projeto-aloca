# Perfil "e2e": usado pelos testes end-to-end (Playwright).
# Usa um PostgreSQL só para os testes (serviço postgres-e2e do docker-compose.yml, porta 5433),
# para não apagar os dados de desenvolvimento. O esquema é recriado a cada execução,
# então os testes sempre começam com os dados de demonstração limpos.
spring.datasource.url=jdbc:postgresql://localhost:5433/aloca_e2e
spring.datasource.username=aloca
spring.datasource.password=aloca
spring.jpa.hibernate.ddl-auto=create-drop
aloca.dados-demo=true
