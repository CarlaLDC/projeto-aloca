# Perfil "mysql": mesmo banco usado nos testes de integração (Testcontainers).
# Suba o banco com: docker compose up -d   (na pasta backend)
# Rode a API com:   mvn spring-boot:run -Dspring-boot.run.profiles=mysql
spring.datasource.url=${ALOCA_DB_URL:jdbc:mysql://localhost:3306/aloca}
spring.datasource.username=${ALOCA_DB_USUARIO:aloca}
spring.datasource.password=${ALOCA_DB_SENHA:aloca}
spring.h2.console.enabled=false
