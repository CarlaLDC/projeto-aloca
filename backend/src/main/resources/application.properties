spring.application.name=aloca-backend
server.port=8080

# Banco H2 em arquivo: os dados continuam após reiniciar o serviço (RNF-04).
# LOCK_TIMEOUT dá tempo para a segunda de duas reservas simultâneas esperar a primeira (RF-06).
spring.datasource.url=jdbc:h2:file:./data/aloca;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
# READ COMMITTED (padrão do H2): após travar os recursos, a checagem de conflito
# enxerga reservas gravadas por outra transação. Necessário no MySQL (padrão REPEATABLE READ).
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

# Console do banco em http://localhost:8080/h2-console (JDBC URL acima, usuário sa, sem senha)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Token de acesso. Troque o segredo em produção (variável ALOCA_JWT_SEGREDO).
aloca.jwt.segredo=${ALOCA_JWT_SEGREDO:troque-este-segredo-de-desenvolvimento-aloca-2026}
aloca.jwt.validade=PT8H

aloca.fuso-horario=America/Sao_Paulo
aloca.dados-demo=true
aloca.ciclo.intervalo=PT1M

spring.mvc.problemdetails.enabled=false
