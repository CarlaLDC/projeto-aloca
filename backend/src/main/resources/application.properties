spring.application.name=aloca-backend
server.port=8080

# Banco PostgreSQL (suba com "docker compose up -d" na pasta backend). Os dados ficam no volume
# do Docker e continuam após reiniciar o serviço (RNF-04). Em produção, use as variáveis de ambiente.
spring.datasource.url=${ALOCA_DB_URL:jdbc:postgresql://localhost:5432/aloca}
spring.datasource.username=${ALOCA_DB_USUARIO:aloca}
spring.datasource.password=${ALOCA_DB_SENHA:aloca}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
# READ COMMITTED (padrão do PostgreSQL): após travar os recursos, a checagem de conflito
# enxerga reservas gravadas por outra transação (RF-06).
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED


# Token de acesso. Troque o segredo em produção (variável ALOCA_JWT_SEGREDO).
aloca.jwt.segredo=${ALOCA_JWT_SEGREDO:troque-este-segredo-de-desenvolvimento-aloca-2026}
aloca.jwt.validade=PT8H

# Proteção contra força bruta: 5 senhas erradas para o mesmo e-mail em 15 min bloqueiam o e-mail por 15 min.
aloca.login.max-tentativas=5
aloca.login.janela=PT15M
aloca.login.bloqueio=PT15M

aloca.fuso-horario=America/Sao_Paulo
aloca.dados-demo=true
# Senha dos usuários de demonstração (só quando aloca.dados-demo=true)
aloca.dados-demo.senha=${ALOCA_SENHA_DEMO:aloca123}
aloca.ciclo.intervalo=PT1M

# Integração externa: serviço de e-mail da instituição que recebe as notificações (POST JSON).
# Vazio = desligado (o envio fica só simulado). Ex.: ALOCA_NOTIFICACAO_URL=https://email.instituicao.edu.br/api/notificacoes
aloca.notificacao.url=${ALOCA_NOTIFICACAO_URL:}
aloca.notificacao.token=${ALOCA_NOTIFICACAO_TOKEN:}
aloca.notificacao.timeout=PT3S

spring.mvc.problemdetails.enabled=false

# Documentação da API: http://localhost:8080/swagger-ui.html (especificação em /v3/api-docs)
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true
