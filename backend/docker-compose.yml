# MySQL local para rodar a API com o perfil "mysql" (mesma imagem dos testes).
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: aloca
      MYSQL_USER: aloca
      MYSQL_PASSWORD: aloca
      MYSQL_ROOT_PASSWORD: aloca-root
    command: --default-time-zone=-03:00 --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3306:3306"
    volumes:
      - aloca-mysql:/var/lib/mysql

volumes:
  aloca-mysql:
