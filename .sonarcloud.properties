# Lido pela "Automatic Analysis" do SonarCloud (o sonar-project.properties só vale para a análise por CI).
# Evidências geradas pelo JMeter (dashboard HTML com jQuery e outras bibliotecas, JTL e logs) não são código
# do projeto: sem esta exclusão, entram como duplicação e problemas de confiabilidade no "código novo".
sonar.exclusions=testes/carga/resultados/**
sonar.cpd.exclusions=testes/carga/resultados/**
