name: CI - Angular

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  angular:
    name: Build e testes Angular
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar para producao
        run: npm run build -- --configuration production

      - name: Executar testes
        run: npm test -- --watch=false --code-coverage --browsers=ChromeHeadless


      - name: Publicar cobertura do frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-cobertura-${{ github.run_id }}
          path: coverage/projeto-aloca/
          if-no-files-found: error
