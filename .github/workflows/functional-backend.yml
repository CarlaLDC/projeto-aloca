name: Verificação backend - qualidade funcional
on:
  push:
    branches: [feat/qualidade-funcional]
  pull_request:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B -f backend/pom.xml clean verify
      - name: Arquivar relatórios de testes e cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualidade-funcional-relatorios
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
          if-no-files-found: warn
