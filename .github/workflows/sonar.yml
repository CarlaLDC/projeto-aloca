name: SonarCloud

# Análise estática com cobertura do back (JaCoCo) e do front (lcov) a cada push e pull request.
# Pré-requisitos no GitHub/SonarCloud:
#   1. Segredo SONAR_TOKEN no repositório (SonarCloud > My Account > Security).
#   2. Em SonarCloud > Administration > Analysis Method, desligar "Automatic Analysis"
#      (senão a análise do CI é recusada).
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  sonar:
    name: Análise SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # histórico completo: o Sonar atribui problemas novos ao autor certo

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Back-end: testes e cobertura (Testcontainers + JaCoCo)
        run: mvn -B -f backend/pom.xml verify

      - name: Front-end: testes e cobertura (lcov)
        run: |
          npm ci
          npm test -- --watch=false --code-coverage --browsers=ChromeHeadless

      - name: Análise SonarCloud
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
