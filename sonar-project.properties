# Análise estática do Aloca (SonarCloud no CI; SonarQube local para conferência).
# Confira projectKey e organization na página do projeto no SonarCloud (Information).
sonar.projectKey=CarlaLDC_projeto-aloca
sonar.organization=carlaldc
sonar.projectName=Aloca
sonar.projectVersion=1.0.0-rc.1
sonar.sourceEncoding=UTF-8

# Código de produção: front Angular e back-end Spring Boot
sonar.sources=src/app,backend/src/main/java
sonar.exclusions=**/*.spec.ts,**/node_modules/**

# Testes: componentes do front, back-end e BDD
sonar.tests=src/app,backend/src/test/java,bdd/steps,bdd/support
sonar.test.inclusions=**/*.spec.ts,backend/src/test/java/**,bdd/steps/**,bdd/support/**

# Java: classes compiladas (mvn verify) e cobertura JaCoCo
sonar.java.source=21
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# TypeScript: cobertura do Karma (ng test --code-coverage)
sonar.javascript.lcov.reportPaths=coverage/projeto-aloca/lcov.info

# Classes de configuração e dados de demonstração não entram na meta de cobertura
sonar.coverage.exclusions=backend/src/main/java/br/com/aloca/config/**,src/app/app.config.ts,src/app/app.routes.ts
